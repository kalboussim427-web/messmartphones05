<div class="container mt-4">
  <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <app-update-marque
      [marque]="updatedMarque"
      [ajout]="ajout"
      (marqueUpdated)="marqueUpdated($event)">
    </app-update-marque>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr><th>Id</th><th>Nom Marque</th><th>Actions</th></tr>
        </thead>
        <tbody>
          @for (m of marques; track m.idMarque) {
            <tr>
              <td>{{ m.idMarque }}</td>
              <td>{{ m.nomMarque }}</td>
              <td>
                <a class="btn btn-success btn-sm" (click)="updateMarque(m)">Editer</a>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
